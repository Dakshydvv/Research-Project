{% extends 'base.html' %}{% block content %}<div class="container py-5"><div class="card p-4"><h2>My Profile</h2><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{u.name}}" required></div><div class="col-md-3"><label class="form-label">Age</label><input class="form-control" type="number" min="1" max="120" name="age" value="{{u.age or ''}}"></div><div class="col-md-3"><label class="form-label">Annual Family Income (₹)</label><input class="form-control" type="number" min="0" name="income" value="{{u.income or ''}}"></div><div class="col-md-4"><label class="form-label">Education</label><select class="form-select" name="education">{% for x in ['','secondary','higher secondary','undergraduate','postgraduate','doctorate'] %}<option {% if u.education==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Occupation</label><input class="form-control" name="occupation" value="{{u.occupation or ''}}" placeholder="student / farmer / employed"></div><div class="col-md-4"><label class="form-label">State</label><input class="form-control" name="state" value="{{u.state or ''}}" placeholder="Uttarakhand"></div><div class="col-md-4"><label class="form-label">Residence</label><select class="form-select" name="residence"><option></option><option {% if u.residence=='rural' %}selected{% endif %}>rural</option><option {% if u.residence=='urban' %}selected{% endif %}>urban</option></select></div><div><button class="btn btn-primary">Save Profile</button></div></form></div></div>{% endblock %}
